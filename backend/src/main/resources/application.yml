server:
  port: ${PORT:8080}

spring:
  application:
    name: wedding-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:wedding}}
    username: ${DB_USERNAME:wedding}
    password: ${DB_PASSWORD:wedding}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate.jdbc.time_zone: Africa/Addis_Ababa
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB
  jackson:
    time-zone: Africa/Addis_Ababa

app:
  jwt:
    # Must be at least 32 characters. Override in production with JWT_SECRET.
    secret: ${JWT_SECRET:change-me-this-secret-must-be-at-least-32-chars-long!}
    ttl-hours: ${JWT_TTL_HOURS:24}
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:admin123}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}
  storage:
    # Uploaded photos and music. Mount this as a volume in production.
    dir: ${STORAGE_DIR:./data/uploads}
