# Render Blueprint: backend API + PostgreSQL.
# Render dashboard → New → Blueprint → pick this repo. Then deploy the frontend on Vercel (see README).
services:
  - type: web
    name: wedding-api
    runtime: docker
    rootDir: backend
    # FREE for testing: sleeps after 15 min idle (~1 min to wake) and uploaded photos
    # are lost on restart. Before the wedding switch to `plan: starter` and uncomment `disk`.
    plan: free
    region: frankfurt
    healthCheckPath: /api/public/event
    # disk:
    #   name: uploads
    #   mountPath: /data/uploads
    #   sizeGB: 1
    envVars:
      - key: DB_HOST
        fromDatabase: { name: wedding-db, property: host }
      - key: DB_PORT
        fromDatabase: { name: wedding-db, property: port }
      - key: DB_NAME
        fromDatabase: { name: wedding-db, property: database }
      - key: DB_USERNAME
        fromDatabase: { name: wedding-db, property: user }
      - key: DB_PASSWORD
        fromDatabase: { name: wedding-db, property: password }
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false          # you type it in the Render dashboard
      - key: STORAGE_DIR
        value: /data/uploads
      - key: JAVA_TOOL_OPTIONS
        value: "-XX:MaxRAMPercentage=70 -XX:+UseSerialGC -Xss512k -XX:TieredStopAtLevel=1"
      - key: CORS_ALLOWED_ORIGINS
        value: https://*.vercel.app

databases:
  - name: wedding-db
    databaseName: wedding
    user: wedding
    # FREE database is deleted 30 days after creation. Upgrade to basic-256mb before then.
    plan: free
    region: frankfurt
