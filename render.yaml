# Render Blueprint: backend API + PostgreSQL.
# Render dashboard → New → Blueprint → pick this repo. Then deploy the frontend on Vercel (see README).
services:
  - type: web
    name: wedding-api
    runtime: docker
    rootDir: backend
    # Starter (paid) keeps the API awake and allows a disk for photos.
    # The free plan sleeps after 15 minutes idle and loses uploaded photos on restart.
    plan: starter
    region: frankfurt
    healthCheckPath: /api/public/event
    disk:
      name: uploads
      mountPath: /data/uploads
      sizeGB: 1
    envVars:
      - key: DB_HOST
        fromDatabase: { name: wedding-db, property: host }
      - key: DB_PORT
        fromDatabase: { name: wedding-db, property: port }
      - key: DB_NAME
        fromDatabase: { name: wedding-db, property: database }
      - key: DB_USERNAME
        fromDatabase: { name: wedding-db, property: user }
      - key: DB_PASSWORD
        fromDatabase: { name: wedding-db, property: password }
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false          # you type it in the Render dashboard
      - key: STORAGE_DIR
        value: /data/uploads
      - key: CORS_ALLOWED_ORIGINS
        value: https://*.vercel.app

databases:
  - name: wedding-db
    databaseName: wedding
    user: wedding
    plan: basic-256mb
    region: frankfurt
